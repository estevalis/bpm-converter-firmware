<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BPM Converter Firmware</title>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
  ></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    #version {
      margin: 20px 0;
      font-size: 1.1em;
    }

    #message {
      margin: 20px 0;
      line-height: 1.6;
    }

    select {
      font-size: 16px;
      padding: 8px 12px;
      margin: 10px;
    }

    esp-web-install-button {
      display: block;
      margin-top: 30px;
    }

    .warning {
      margin-top: 30px;
      padding: 15px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 6px;
      line-height: 1.6;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>

  <h1>BPM Converter</h1>

  <div id="version">
    펌웨어 정보를 불러오는 중...
  </div>

  <div id="message">
    USB로 ESP32를 연결한 후 펌웨어를 설치하세요.
  </div>

  <select id="versionSelect"></select>

  <esp-web-install-button id="installButton">
    <button slot="activate">
      펌웨어 설치
    </button>

    <span slot="unsupported">
      이 브라우저에서는 Web Serial을 지원하지 않습니다.
    </span>

    <span slot="not-allowed">
      HTTPS 페이지에서 사용해야 합니다.
    </span>
  </esp-web-install-button>

  <div class="warning">
    <strong>주의</strong><br>
    기존 Wi-Fi 설정 및 장치 설정을 유지하려면
    초기화(Erase)하지 마세요.
  </div>

  <script>
    const BASE_URL =
      "https://estevalis.github.io/bpm-converter-firmware";

    const versionElement =
      document.getElementById("version");

    const messageElement =
      document.getElementById("message");

    const versionSelect =
      document.getElementById("versionSelect");

    const installButton =
      document.getElementById("installButton");


    async function getLatestVersion() {

      const response = await fetch(
        `${BASE_URL}/latest.json`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          `latest.json HTTP ${response.status}`
        );
      }

      const data = await response.json();

      return Number(data.version);
    }


    async function getFlashConfig(version) {

      const url =
        `${BASE_URL}/firmware/${version}/flash.json`;

      const response = await fetch(
        url,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          `flash.json HTTP ${response.status}`
        );
      }

      return await response.json();
    }


    function createManifest(
      version,
      flashConfig
    ) {

      const parts = [];

      for (
        const file of flashConfig.files
      ) {

        /*
         * firmware.factory.bin은
         * NVS 보존을 위해 사용하지 않습니다.
         */
        if (
          file.name ===
          "firmware.factory.bin"
        ) {
          continue;
        }

        parts.push({
          path:
            `${BASE_URL}/firmware/${version}/${file.name}`,

          offset:
            Number(file.address)
        });
      }


      return {
        name: "BPM Converter",

        version:
          String(version),

        new_install_prompt_erase:
          true,

        builds: [
          {
            chipFamily: "ESP32",

            improv: false,

            parts: parts
          }
        ]
      };
    }


    async function loadFirmware(
      version
    ) {

      versionElement.textContent =
        `펌웨어 ${version}`;

      messageElement.textContent =
        "펌웨어 정보를 불러오는 중...";


      const flashConfig =
        await getFlashConfig(version);


      console.log(
        "flash.json:",
        flashConfig
      );


      const manifest =
        createManifest(
          version,
          flashConfig
        );


      console.log(
        "manifest:",
        manifest
      );


      /*
       * ESP Web Tools의 공식 dynamic
       * manifest 방식입니다.
       */
      const json =
        JSON.stringify(manifest);

      const blob =
        new Blob(
          [json],
          {
            type:
              "application/json"
          }
        );


      const manifestUrl =
        URL.createObjectURL(blob);


      installButton.manifest =
        manifestUrl;


      messageElement.innerHTML =
        "USB로 ESP32를 연결한 후<br>" +
        "펌웨어를 설치하세요.";
    }


    async function initialize() {

      try {

        const latest =
          await getLatestVersion();


        /*
         * 현재는 latest 버전만 표시합니다.
         * 이전 버전 선택 기능은 이후에
         * versions.json을 추가해서 구현합니다.
         */
        versionSelect.innerHTML = "";

        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(latest);

        option.textContent =
          `Build ${latest}`;

        versionSelect.appendChild(
          option
        );


        await loadFirmware(
          latest
        );

      } catch (error) {

        console.error(
          error
        );

        versionElement.textContent =
          "펌웨어 정보를 불러오지 못했습니다.";

        messageElement.innerHTML =
          `<span class="error">${
            error.message
          }</span>`;
      }
    }


    versionSelect.addEventListener(
      "change",
      async () => {

        try {

          const version =
            Number(
              versionSelect.value
            );

          await loadFirmware(
            version
          );

        } catch (error) {

          console.error(
            error
          );

          messageElement.innerHTML =
            `<span class="error">${
              error.message
            }</span>`;
        }
      }
    );


    initialize();

  </script>

</body>
</html>
